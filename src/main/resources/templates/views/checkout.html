<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Kudo Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: #f5f5f5;
        }

        .checkout-box {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
        }

        .item-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 5px;
            background: white;
        }

        .btn-order {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            width: 100%;
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 8px;
            border: none;
            transition: all 0.3s;
        }

        .btn-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            color: white;
        }
    </style>
</head>

<body>
    <div th:replace="common/header :: header"></div>

    <div class="container my-5">
        <h2 class="mb-4 fw-bold" style="color: #090040;">Thông tin thanh toán</h2>

        <form th:action="@{/checkout/process}" method="POST">
            <div class="row">
                <div class="col-lg-7">
                    <div class="checkout-box">
                        <h5 class="fw-bold mb-4 border-bottom pb-2">Địa chỉ nhận hàng</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ tên người nhận <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" th:value="${user.fullName}"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="text" name="phone" class="form-control" th:value="${user.phoneNumber}"
                                    required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Tỉnh / Thành phố <span class="text-danger">*</span></label>
                                <input type="text" name="province" class="form-control" placeholder="VD: Hà Nội"
                                    required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Quận / Huyện <span class="text-danger">*</span></label>
                                <input type="text" name="district" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Phường / Xã <span class="text-danger">*</span></label>
                                <input type="text" name="ward" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Địa chỉ cụ thể (Số nhà, tên đường) <span
                                    class="text-danger">*</span></label>
                            <input type="text" name="address" class="form-control" required>
                        </div>

                        <h5 class="fw-bold mb-3 border-bottom pb-2">Phương thức vận chuyển</h5>
                        <select name="shippingUnit" class="form-select mb-3">
                            <option value="Giao Hàng Nhanh">Giao Hàng Nhanh (GHN)</option>
                            <option value="Giao Hàng Tiết Kiệm">Giao Hàng Tiết Kiệm (GHTK)</option>
                            <option value="Viettel Post">Viettel Post</option>
                        </select>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="order-summary">
                        <h5 class="fw-bold border-bottom pb-3 mb-3">Đơn hàng của bạn (<span
                                th:text="${cartItems.size()}">0</span> sản phẩm)</h5>

                        <div class="d-flex align-items-center mb-3 border-bottom pb-2" th:each="item : ${cartItems}">
                            <div class="position-relative me-3">
                                <img th:if="${item.idProduct.picture != 'product_default.png'}"
                                    th:src="@{'/images/' + ${item.idProduct.picture}}" class="item-img">
                                <i th:if="${item.idProduct.picture == 'product_default.png'}"
                                    class="fas fa-box item-img d-flex align-items-center justify-content-center text-muted fs-3"></i>
                                <span
                                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary"
                                    th:text="${item.quantity}">1</span>
                            </div>
                            <div class="flex-grow-1">
                                <div class="fw-bold" style="font-size: 0.9rem;" th:text="${item.idProduct.nameProduct}">
                                    Tên</div>
                            </div>
                            <div class="fw-bold text-danger ms-2"
                                th:with="price=${item.idProduct.price - (item.idProduct.price * item.idProduct.discount / 100)}"
                                th:text="${#numbers.formatDecimal(price * item.quantity, 0, 'COMMA', 0, 'POINT')} + '₫'">
                                0₫</div>
                        </div>

                        <div class="d-flex justify-content-between mb-2 mt-4">
                            <span class="text-muted">Tạm tính</span>
                            <span class="fw-bold"
                                th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                            <span class="text-muted">Phí vận chuyển</span>
                            <span class="fw-bold"
                                th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold fs-5">Tổng cộng</span>
                            <span class="fw-bold fs-4 text-danger"
                                th:text="${#numbers.formatDecimal(finalTotal, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                        </div>

                        <button type="submit" class="btn-order">ĐẶT HÀNG</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div th:replace="common/footer :: footer"></div>
</body>

</html>
