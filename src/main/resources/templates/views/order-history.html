<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lịch sử đơn hàng - Kudo Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: #f5f5f5;
        }

        .order-box {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .table-order th {
            background-color: #f8f9fa;
            color: #333;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-shipping {
            background-color: #cce5ff;
            color: #004085;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
        }

        .status-canceled {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <div th:replace="common/header :: header"></div>

    <div class="container my-5">
        <h2 class="mb-4 fw-bold" style="color: #090040;">Lịch sử đơn hàng của bạn</h2>

        <div class="order-box">
            <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
                <i class="fas fa-box-open text-muted mb-3" style="font-size: 4rem;"></i>
                <h5 class="text-muted">Bạn chưa có đơn hàng nào</h5>
                <a th:href="@{/home}" class="btn btn-primary mt-3" style="background: #090040; border: none;">Mua sắm
                    ngay</a>
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Mã ĐH</th>
                            <th>Ngày đặt</th>
                            <th>Đơn vị vận chuyển</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="fw-bold">#<span th:text="${order.id}"></span></td>
                            <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}"></td>
                            <td th:text="${order.shippingUnit}"></td>
                            <td class="fw-bold text-danger"
                                th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</td>
                            <td>
                                <span class="status-badge status-pending" th:text="${order.status}">Đang chờ
                                    duyệt</span>
                            </td>
                            <td>
                                <a th:href="@{'/orders/detail/' + ${order.id}}"
                                    class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="common/footer :: footer"></div>
</body>

</html>
