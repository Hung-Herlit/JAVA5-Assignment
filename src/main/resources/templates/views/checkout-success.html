<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body style="background: #f5f5f5;">
    <div th:replace="common/header :: header"></div>

    <div class="container my-5 text-center">
        <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 600px; border-radius: 15px;">
            <i class="fas fa-check-circle text-success mb-4" style="font-size: 6rem;"></i>
            <h2 class="fw-bold mb-3">Đặt hàng thành công!</h2>
            <p class="text-muted mb-4">Cảm ơn bạn đã tin tưởng mua sắm tại Kudo Computer. Đơn hàng của bạn đang được
                chúng tôi xử lý. Chúng tôi sẽ sớm liên hệ để giao hàng cho bạn.</p>
            <a th:href="@{/home}" class="btn btn-primary px-4 py-2 fw-bold"
                style="background: #090040; border: none;">Về trang chủ</a>
        </div>
    </div>

    <div th:replace="common/footer :: footer"></div>
</body>

</html>
