<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng - Kudo Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: #f5f5f5;
        }

        .detail-box {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .product-img-small {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 5px;
            background: #f8f9fa;
        }
    </style>
</head>

<body>
    <div th:replace="common/header :: header"></div>

    <div class="container my-5">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/orders}" class="btn btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i> Quay
                lại</a>
            <h2 class="fw-bold mb-0" style="color: #090040;">Chi tiết đơn hàng #<span th:text="${order.id}"></span></h2>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="detail-box">
                    <h5 class="fw-bold border-bottom pb-2 mb-3">Danh sách sản phẩm</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th>Đơn giá</th>
                                    <th>Số lượng</th>
                                    <th>Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${orderDetails}">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:if="${item.idProduct.picture != 'product_default.png'}"
                                                th:src="@{'/images/' + ${item.idProduct.picture}}"
                                                class="product-img-small">
                                            <i th:if="${item.idProduct.picture == 'product_default.png'}"
                                                class="fas fa-box fs-2 text-muted"></i>
                                            <div>
                                                <a th:href="@{'/product/' + ${item.idProduct.slug}}"
                                                    class="text-decoration-none fw-bold text-dark"
                                                    th:text="${item.idProduct.nameProduct}">Tên</a>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:with="price=${item.currentPrice - (item.currentPrice * item.currentDiscount / 100)}"
                                        th:text="${#numbers.formatDecimal(price, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</td>
                                    <td class="text-center" th:text="${item.quantity}">1</td>
                                    <td class="fw-bold text-danger"
                                        th:with="price=${item.currentPrice - (item.currentPrice * item.currentDiscount / 100)}"
                                        th:text="${#numbers.formatDecimal(price * item.quantity, 0, 'COMMA', 0, 'POINT')} + '₫'">
                                        0₫</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="detail-box">
                    <h5 class="fw-bold border-bottom pb-2 mb-3">Thông tin giao hàng</h5>
                    <p><strong>Trạng thái:</strong> <span class="badge bg-warning text-dark"
                            th:text="${order.status}">Đang chờ</span></p>
                    <p><strong>Ngày đặt:</strong> <span
                            th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Đơn vị vận chuyển:</strong> <span th:text="${order.shippingUnit}"></span></p>
                    <hr>
                    <p><strong>Thông tin nhận hàng:</strong></p>
                    <p class="text-muted" style="white-space: pre-line;"
                        th:text="${#strings.replace(order.deliveryInfo, ' | ', '&#10;')}">Tên - SĐT - Địa chỉ</p>
                </div>

                <div class="detail-box">
                    <h5 class="fw-bold border-bottom pb-2 mb-3">Tổng cộng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tạm tính:</span>
                        <span
                            th:text="${#numbers.formatDecimal(order.total - order.shippingFee + order.allDiscount, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span
                            th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Giảm giá:</span>
                        <span
                            th:text="'-' + ${#numbers.formatDecimal(order.allDiscount, 0, 'COMMA', 0, 'POINT')} + '₫'">-0₫</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold fs-5">Thành tiền:</span>
                        <span class="fw-bold fs-4 text-danger"
                            th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="common/footer :: footer"></div>
</body>

</html>
