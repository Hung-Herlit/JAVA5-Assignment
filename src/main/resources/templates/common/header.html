<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom" id="mainHeader">
            <div class="container">
                <a class="navbar-brand me-4" th:href="@{/home}">
                    <span class="kudo">Kudo</span><span class="computer">Computer</span>
                    <span class="tagline">BY JAVA5</span>
                </a>

                <div class="d-flex align-items-center justify-content-center flex-grow-1">
                    <form th:action="@{/search}" method="GET" class="search-form d-flex">
                        <input class="form-control" type="search" name="keywords" th:value="${keywords}" placeholder="Bạn cần tìm gì?"
                            aria-label="Search">
                        <button class="btn btn-search" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>

                <div class="d-none d-lg-flex align-items-center gap-3">
                    <div th:if="${session.currentUser == null}">
                        <a th:href="@{/login}" class="user-menu">
                            <i class="far fa-user-circle fs-5"></i>
                            <div class="d-flex flex-column" style="font-size: 0.85rem;">
                                <span>Tài khoản</span>
                                <span style="font-size: 0.75rem;">Đăng nhập</span>
                            </div>
                        </a>
                    </div>

                    <div th:if="${session.currentUser != null}" class="dropdown">
                        <a href="#" class="user-menu dropdown-toggle" data-bs-toggle="dropdown"
                            style="text-decoration: none;">
                            <img th:if="${session.currentUser.avatar != null}"
                                th:src="@{'/images/' + ${session.currentUser.avatar}}" class="rounded-circle" width="30"
                                height="30" alt="Avatar">
                            <i th:if="${session.currentUser.avatar == null}" class="far fa-user-circle fs-5"></i>
                            <div class="d-flex flex-column" style="font-size: 0.85rem;">
                                <span>Xin chào,</span>
                                <span style="font-size: 0.75rem; font-weight: bold;"
                                    th:text="${session.currentUser.fullName}">Tên User</span>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end mt-2">
                            <li><a class="dropdown-item" th:href="@{/orders}">Đơn hàng của tôi</a></li>
                            <li th:if="${session.currentUser != null && session.currentUser.admin}">
                                <a class="dropdown-item fw-bold" th:href="@{/admin/dashboard}" style="color: #B13BFF;">
                                    <i class="fas fa-user-shield me-2"></i>Trang Quản Trị
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" th:href="@{/logout}">Đăng xuất</a></li>
                        </ul>
                    </div>

                    <a th:href="@{/cart}" class="cart-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge-cart" th:text="${cartCount}">0</span>
                        <span>Giỏ hàng</span>
                    </a>
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>

        <script>
            window.addEventListener('scroll', function () {
                const header = document.getElementById('mainHeader');
                if (window.scrollY > 200) {
                    header.classList.add('sticky');
                } else {
                    header.classList.remove('sticky');
                }
            });
        </script>
    </div>
</body>

</html>
