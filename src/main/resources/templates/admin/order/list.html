<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <h2 class="fw-bold mb-4">Quản lý Đơn hàng</h2>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Mã ĐH</th>
                                <th>Ngày đặt</th>
                                <th>Khách hàng</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="fw-bold" th:text="'#' + ${order.id}"></td>
                                <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <div th:text="${order.user.fullName}"></div>
                                    <div class="small text-muted" th:text="${order.user.phoneNumber}"></div>
                                </td>
                                <td class="text-danger fw-bold"
                                    th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                </td>
                                <td>
                                    <span th:if="${order.status == 'Đang chờ duyệt'}" class="badge bg-warning text-dark"
                                        th:text="${order.status}"></span>
                                    <span th:if="${order.status == 'Đang giao'}" class="badge bg-info text-dark"
                                        th:text="${order.status}"></span>
                                    <span th:if="${order.status == 'Hoàn thành'}" class="badge bg-success"
                                        th:text="${order.status}"></span>
                                    <span th:if="${order.status == 'Đã hủy'}" class="badge bg-danger"
                                        th:text="${order.status}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/admin/orders/detail/' + ${order.id}}"
                                        class="btn btn-sm btn-primary">
                                        <i class="fas fa-eye"></i> Xem / Duyệt
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="6" class="text-center">Chưa có đơn hàng nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
