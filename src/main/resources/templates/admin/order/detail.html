<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Chi tiết Đơn hàng: <span class="text-primary" th:text="'#' + ${order.id}"></span>
                </h2>
                <a th:href="@{/admin/orders}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Quay
                    lại</a>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-dark text-white fw-bold">Thông tin Giao hàng</div>
                        <div class="card-body">
                            <p><strong>Khách hàng:</strong> <span th:text="${order.user.fullName}"></span></p>
                            <p><strong>Ngày đặt:</strong> <span
                                    th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}"></span></p>
                            <p><strong>ĐV Vận chuyển:</strong> <span th:text="${order.shippingUnit}"></span></p>
                            <hr>
                            <p><strong>Thông tin nhận hàng:</strong></p>
                            <p class="text-muted" th:text="${order.deliveryInfo}"></p>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white fw-bold">Cập nhật Trạng thái</div>
                        <div class="card-body">
                            <form th:action="@{/admin/orders/update-status}" method="POST">
                                <input type="hidden" name="orderId" th:value="${order.id}">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Trạng thái hiện tại:</label>
                                    <select name="status" class="form-select">
                                        <option value="Đang chờ duyệt"
                                            th:selected="${order.status == 'Đang chờ duyệt'}">Đang chờ duyệt</option>
                                        <option value="Đang giao" th:selected="${order.status == 'Đang giao'}">Đang giao
                                        </option>
                                        <option value="Hoàn thành" th:selected="${order.status == 'Hoàn thành'}">Hoàn
                                            thành</option>
                                        <option value="Đã hủy" th:selected="${order.status == 'Đã hủy'}">Đã hủy</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-success w-100"><i class="fas fa-save"></i> Cập
                                    nhật</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-dark text-white fw-bold">Danh sách Sản phẩm</div>
                        <div class="card-body">
                            <table class="table table-bordered">
                                <thead class="table-light">
                                    <tr>
                                        <th>Sản phẩm</th>
                                        <th class="text-center">Đơn giá</th>
                                        <th class="text-center">Số lượng</th>
                                        <th class="text-end">Thành tiền</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="detail : ${orderDetails}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <img th:src="@{'/images/' + ${detail.idProduct.picture}}" alt="Product"
                                                    style="width: 50px; height: 50px; object-fit: cover;"
                                                    class="me-3 rounded">
                                                <span th:text="${detail.idProduct.nameProduct}"></span>
                                            </div>
                                        </td>
                                        <td class="text-center align-middle"
                                            th:text="${#numbers.formatDecimal(detail.currentPrice - (detail.currentPrice * detail.currentDiscount / 100), 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        </td>
                                        <td class="text-center align-middle" th:text="${detail.quantity}"></td>
                                        <td class="text-end align-middle fw-bold"
                                            th:text="${#numbers.formatDecimal((detail.currentPrice - (detail.currentPrice * detail.currentDiscount / 100)) * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <div class="d-flex justify-content-end mt-4">
                                <table class="table table-borderless w-50">
                                    <tr>
                                        <td class="text-end">Phí vận chuyển:</td>
                                        <td class="text-end"
                                            th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-end fw-bold fs-5 text-danger">TỔNG CỘNG:</td>
                                        <td class="text-end fw-bold fs-5 text-danger"
                                            th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
