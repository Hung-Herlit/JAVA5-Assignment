<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Thông tin Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <h2 class="fw-bold mb-4" th:text="${pageTitle}"></h2>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form th:action="@{/admin/users/save}" th:object="${user}" method="POST"
                        enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{avatar}" />

                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Họ và Tên <span
                                            class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}" class="form-control" required>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Email <span
                                                class="text-danger">*</span></label>
                                        <input type="email" th:field="*{email}" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Số điện thoại <span
                                                class="text-danger">*</span></label>
                                        <input type="text" th:field="*{phoneNumber}" class="form-control" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Mật khẩu</label>
                                        <input type="password" name="newPassword" class="form-control"
                                            th:placeholder="${user.id != null ? 'Bỏ trống nếu không đổi' : 'Nhập mật khẩu'}">
                                        <input type="hidden" th:field="*{password}" th:if="${user.id != null}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Ngày sinh</label>
                                        <input type="date" th:field="*{birthday}" class="form-control">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Giới tính</label>
                                        <select th:field="*{gender}" class="form-select">
                                            <option th:value="true">Nam</option>
                                            <option th:value="false">Nữ</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="card bg-light mb-3">
                                    <div class="card-body text-center">
                                        <label class="form-label fw-bold w-100 text-start">Ảnh đại diện</label>
                                        <img th:if="${user.avatar != null}" th:src="@{'/images/' + ${user.avatar}}"
                                            class="img-fluid mb-3 rounded-circle shadow-sm"
                                            style="width: 150px; height: 150px; object-fit: cover;">
                                        <i th:unless="${user.avatar != null}" class="fas fa-user-circle text-muted mb-3"
                                            style="font-size: 8rem;"></i>

                                        <input type="file" name="imageFile" class="form-control" accept="image/*">
                                    </div>
                                </div>

                                <div class="p-3 bg-light rounded border">
                                    <div class="form-check form-switch mb-2">
                                        <input class="form-check-input" type="checkbox" th:field="*{admin}"
                                            id="adminSwitch">
                                        <label class="form-check-label fw-bold" for="adminSwitch">Quyền Quản trị
                                            viên</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{active}"
                                            id="activeSwitch">
                                        <label class="form-check-label fw-bold" for="activeSwitch">Tài khoản hoạt
                                            động</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success px-4"><i class="fas fa-save me-2"></i>Lưu thông
                                tin</button>
                            <a th:href="@{/admin/users}" class="btn btn-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
