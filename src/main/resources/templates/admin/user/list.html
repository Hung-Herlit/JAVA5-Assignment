<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Quản lý Người Dùng</h2>
                <a th:href="@{/admin/users/create}" class="btn btn-primary"><i class="fas fa-user-plus"></i> Thêm người
                    dùng</a>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form th:action="@{/admin/users}" method="GET" class="mb-4 d-flex" style="max-width: 500px;">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2"
                            placeholder="Tìm theo tên, email hoặc SĐT...">
                        <button type="submit" class="btn btn-secondary"><i class="fas fa-search"></i></button>
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary ms-2"><i
                                class="fas fa-redo"></i></a>
                    </form>

                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Avatar</th>
                                <th>Họ tên / SĐT</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="text-center">
                                    <img th:if="${u.avatar != null}" th:src="@{'/images/' + ${u.avatar}}"
                                        class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                                    <i th:unless="${u.avatar != null}" class="fas fa-user-circle text-muted fs-3"></i>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${u.fullName}"></div>
                                    <div class="text-muted small" th:text="${u.phoneNumber}"></div>
                                </td>
                                <td th:text="${u.email}"></td>
                                <td>
                                    <span th:if="${u.admin}" class="badge bg-danger">Quản trị viên</span>
                                    <span th:unless="${u.admin}" class="badge bg-info text-dark">Khách hàng</span>
                                </td>
                                <td>
                                    <span th:if="${u.active}" class="badge bg-success">Hoạt động</span>
                                    <span th:unless="${u.active}" class="badge bg-secondary">Đã khóa</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/admin/users/edit/' + ${u.id}}" class="btn btn-sm btn-warning"
                                        title="Sửa">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{'/admin/users/toggle-status/' + ${u.id}}"
                                        th:class="${u.active ? 'btn btn-sm btn-danger' : 'btn btn-sm btn-success'}"
                                        th:title="${u.active ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}"
                                        onclick="return confirm('Xác nhận thay đổi trạng thái tài khoản này?');">
                                        <i th:class="${u.active ? 'fas fa-lock' : 'fas fa-lock-open'}"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="6" class="text-center">Không tìm thấy người dùng nào.</td>
                            </tr>
                        </tbody>
                    </table>

                    <nav th:if="${totalPages > 1}" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                                th:classappend="${currentPage == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${i}, keyword=${keyword})}"
                                    th:text="${i}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
