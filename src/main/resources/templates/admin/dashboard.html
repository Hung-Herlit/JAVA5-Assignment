<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tổng Quan Hệ Thống - Kudo Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .stat-card {
            transition: transform 0.2s;
            border-radius: 15px;
            border: none;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <h2 class="fw-bold mb-4 text-dark">Bảng Điều Khiển (Dashboard)</h2>

            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card stat-card bg-white shadow-sm h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-success bg-opacity-10 text-success me-3">
                                <i class="fas fa-money-bill-wave"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Tổng Doanh Thu</h6>
                                <h4 class="mb-0 fw-bold"
                                    th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ
                                </h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card bg-white shadow-sm h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-primary bg-opacity-10 text-primary me-3">
                                <i class="fas fa-shopping-cart"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Tổng Đơn Hàng</h6>
                                <h4 class="mb-0 fw-bold" th:text="${totalOrders}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card bg-white shadow-sm h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-warning bg-opacity-10 text-warning me-3">
                                <i class="fas fa-users"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Khách Hàng</h6>
                                <h4 class="mb-0 fw-bold" th:text="${totalUsers}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card bg-white shadow-sm h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-info bg-opacity-10 text-info me-3">
                                <i class="fas fa-box-open"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Sản Phẩm</h6>
                                <h4 class="mb-0 fw-bold" th:text="${totalProducts}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-clock text-primary me-2"></i> Đơn hàng mới nhất</h5>
                    <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-primary">Xem tất cả</a>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Mã ĐH</th>
                                <th>Khách hàng</th>
                                <th>Ngày đặt</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${recentOrders}">
                                <td class="ps-4 fw-bold" th:text="'#' + ${order.id}"></td>
                                <td>
                                    <div th:text="${order.user.fullName}"></div>
                                    <small class="text-muted" th:text="${order.user.phoneNumber}"></small>
                                </td>
                                <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}"></td>
                                <td class="fw-bold text-danger"
                                    th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                </td>
                                <td>
                                    <span th:if="${order.status == 'Đang chờ duyệt'}"
                                        class="badge bg-warning text-dark">Chờ duyệt</span>
                                    <span th:if="${order.status == 'Đang giao'}" class="badge bg-info text-dark">Đang
                                        giao</span>
                                    <span th:if="${order.status == 'Hoàn thành'}" class="badge bg-success">Hoàn
                                        thành</span>
                                    <span th:if="${order.status == 'Đã hủy'}" class="badge bg-danger">Đã hủy</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentOrders)}">
                                <td colspan="5" class="text-center py-4 text-muted">Chưa có đơn hàng nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
