<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Quản lý Danh Mục</h2>
                <a th:href="@{/admin/categories/create}" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm
                    mới</a>
            </div>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form th:action="@{/admin/categories}" method="GET" class="mb-4 d-flex" style="max-width: 400px;">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2"
                            placeholder="Tìm tên danh mục...">
                        <button type="submit" class="btn btn-secondary"><i class="fas fa-search"></i></button>
                        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary ms-2" title="Xóa tìm kiếm"><i
                                class="fas fa-redo"></i></a>
                    </form>

                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Tên danh mục</th>
                                <th>Slug</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.id}"></td>
                                <td class="fw-bold" th:text="${cat.nameCategory}"></td>
                                <td th:text="${cat.slug}"></td>
                                <td>
                                    <span th:if="${cat.isActive}" class="badge bg-success">Đang hoạt động</span>
                                    <span th:unless="${cat.isActive}" class="badge bg-secondary">Đã ẩn</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/admin/categories/edit/' + ${cat.id}}"
                                        class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                    <a th:href="@{'/admin/categories/delete/' + ${cat.id}}"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm('Bạn có chắc muốn xóa danh mục này?');"><i
                                            class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="5" class="text-center">Không tìm thấy dữ liệu.</td>
                            </tr>
                        </tbody>
                    </table>

                    <nav th:if="${totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/categories(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                                th:classappend="${currentPage == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword})}"
                                    th:text="${i}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/admin/categories(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
