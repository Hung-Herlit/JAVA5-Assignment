<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Thêm/Sửa Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <h2 class="fw-bold mb-4" th:text="${pageTitle}"></h2>

            <div class="card shadow-sm border-0" style="max-width: 600px;">
                <div class="card-body">
                    <form th:action="@{/admin/categories/save}" th:object="${category}" method="POST">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Danh Mục <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{nameCategory}" class="form-control" required
                                placeholder="VD: Laptop Gaming">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Đường dẫn (Slug) <span
                                    class="text-danger">*</span></label>
                            <input type="text" th:field="*{slug}" class="form-control" required
                                placeholder="VD: laptop-gaming">
                            <small class="text-muted">Đường dẫn thân thiện trên URL, không có dấu và khoảng
                                trắng.</small>
                        </div>

                        <div class="mb-4 form-check form-switch">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch">
                            <label class="form-check-label fw-bold" for="activeSwitch">Cho phép hiển thị
                                (Active)</label>
                        </div>

                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Lưu Dữ Liệu</button>
                        <a th:href="@{/admin/categories}" class="btn btn-secondary">Hủy bỏ</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
