<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="d-flex">
        <div th:replace="admin/fragments :: sidebar"></div>

        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Quản lý Sản Phẩm</h2>
                <a th:href="@{/admin/products/create}" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm mới</a>
            </div>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form th:action="@{/admin/products}" method="GET" class="mb-4 d-flex" style="max-width: 400px;">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2"
                            placeholder="Tìm tên sản phẩm...">
                        <button type="submit" class="btn btn-secondary"><i class="fas fa-search"></i></button>
                        <a th:href="@{/admin/products}" class="btn btn-outline-secondary ms-2"><i
                                class="fas fa-redo"></i></a>
                    </form>

                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Hình ảnh</th>
                                <th>Tên sản phẩm</th>
                                <th>Hãng</th>
                                <th>Giá bán / Tồn kho</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td>
                                    <img th:if="${p.picture != 'product_default.png'}"
                                        th:src="@{'/images/' + ${p.picture}}"
                                        style="width: 50px; height: 50px; object-fit: contain;">
                                    <i th:if="${p.picture == 'product_default.png'}"
                                        class="fas fa-box text-muted fs-3"></i>
                                </td>
                                <td class="fw-bold" th:text="${p.nameProduct}"></td>
                                <td th:text="${p.idCompany != null ? p.idCompany.companyName : ''}"></td>
                                <td>
                                    <div th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'"
                                        class="text-danger fw-bold"></div>
                                    <div class="text-muted" style="font-size: 0.85rem;">Tồn: <span
                                            th:text="${p.stock}"></span></div>
                                </td>
                                <td>
                                    <span th:if="${p.active}" class="badge bg-success">Đang bán</span>
                                    <span th:unless="${p.active}" class="badge bg-secondary">Đã ẩn</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/admin/products/edit/' + ${p.id}}" class="btn btn-sm btn-warning"><i
                                            class="fas fa-edit"></i></a>
                                    <a th:href="@{'/admin/products/delete/' + ${p.id}}" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Ẩn sản phẩm này?');"><i class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="6" class="text-center">Không tìm thấy dữ liệu.</td>
                            </tr>
                        </tbody>
                    </table>

                    <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                            </li>
                    
                            <th:block th:if="${totalPages <= 7}">
                                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                                    th:classappend="${currentPage == i ? 'active' : ''}">
                                    <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                                </li>
                            </th:block>
                    
                            <th:block th:if="${totalPages > 7}">
                    
                                <th:block th:if="${currentPage <= 4}">
                                    <li class="page-item" th:each="i : ${#numbers.sequence(1, 5)}"
                                        th:classappend="${currentPage == i ? 'active' : ''}">
                                        <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                                    </li>
                                    <li class="page-item disabled"><span class="page-link">...</span></li>
                                    <li class="page-item">
                                        <a class="page-link" th:href="@{/admin/products(page=${totalPages}, keyword=${keyword})}"
                                            th:text="${totalPages}"></a>
                                    </li>
                                </th:block>
                    
                                <th:block th:if="${currentPage >= totalPages - 3}">
                                    <li class="page-item">
                                        <a class="page-link" th:href="@{/admin/products(page=1, keyword=${keyword})}">1</a>
                                    </li>
                                    <li class="page-item disabled"><span class="page-link">...</span></li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(totalPages - 4, totalPages)}"
                                        th:classappend="${currentPage == i ? 'active' : ''}">
                                        <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                                    </li>
                                </th:block>
                    
                                <th:block th:if="${currentPage > 4 && currentPage < totalPages - 3}">
                                    <li class="page-item">
                                        <a class="page-link" th:href="@{/admin/products(page=1, keyword=${keyword})}">1</a>
                                    </li>
                                    <li class="page-item disabled"><span class="page-link">...</span></li>
                    
                                    <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 1, currentPage + 1)}"
                                        th:classappend="${currentPage == i ? 'active' : ''}">
                                        <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                                    </li>
                    
                                    <li class="page-item disabled"><span class="page-link">...</span></li>
                                    <li class="page-item">
                                        <a class="page-link" th:href="@{/admin/products(page=${totalPages}, keyword=${keyword})}"
                                            th:text="${totalPages}"></a>
                                    </li>
                                </th:block>
                    
                            </th:block>
                    
                            <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
