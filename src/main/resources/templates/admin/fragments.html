<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="sidebar" class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
        <h3 class="fw-bold mb-4 text-center" style="color: #B13BFF;">Kudo Admin</h3>
        <ul class="nav flex-column gap-2" id="adminSidebar">
            <li class="nav-item">
                <a class="nav-link text-white sidebar-link" th:href="@{/admin/dashboard}"><i
                        class="fas fa-chart-line me-2"></i> Tổng quan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white sidebar-link" th:href="@{/admin/categories}"><i
                        class="fas fa-list me-2"></i> Danh mục</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white sidebar-link" th:href="@{/admin/products}"><i class="fas fa-box me-2"></i>
                    Sản phẩm</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white sidebar-link" th:href="@{/admin/orders}"><i
                        class="fas fa-shopping-cart me-2"></i> Đơn hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white sidebar-link" th:href="@{/admin/users}"><i class="fas fa-users me-2"></i>
                    Người dùng</a>
            </li>
        </ul>
        <hr>
        <a th:href="@{/home}" class="btn btn-outline-light w-100"><i class="fas fa-globe me-2"></i> Xem Website</a>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                let currentUrl = window.location.pathname;
                let links = document.querySelectorAll("#adminSidebar .sidebar-link");

                links.forEach(link => {
                    let href = link.getAttribute("href");
                    // Nếu URL hiện tại chứa href của link (VD: /admin/products/create cũng sẽ làm sáng menu Sản phẩm)
                    if (href !== '#' && currentUrl.includes(href)) {
                        link.classList.add("bg-primary", "rounded");
                    } else {
                        link.classList.remove("bg-primary", "rounded");
                    }
                });
            });
        </script>
    </div>

</body>

</html>
