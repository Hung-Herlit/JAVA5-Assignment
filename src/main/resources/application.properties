# ===============================
# 1. APPLICATION & SERVER
# ===============================
spring.application.name=kudo-computer

# ===============================
# 2. DATABASE CONFIGURATION (SQL SERVER)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=KudoComputer;encrypt=true;trustServerCertificate=true;
spring.datasource.username=kudoha
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# 3. JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Giữ nguyên tên cột (CreateDate, CategoryId) không đổi sang snake_case (create_date, category_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# 4. MULTIPART (FILE UPLOAD) CONFIGURATION
# ===============================
# Kích hoạt tính năng xử lý file (Multipart)
spring.servlet.multipart.enabled=true

# Giới hạn dung lượng file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-part-count=1000